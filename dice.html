<!DOCTYPE html>
<html>
<head>
    <title>Dice Roller</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"></script>
    <style>
        :root {
            --ink: #0c0a09;
            --panel: #16120f;
            --panel-line: #2b241d;
            --parchment: #cbbfa8;
            --parchment-dim: #8f8471;
            --oxblood: #6e1423;
            --oxblood-bright: #9c2a3a;
            --gold: #9c8552;
            --good: #5a6e4f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--ink);
            background-image:
                radial-gradient(ellipse at top left, rgba(110,20,35,0.08), transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(110,20,35,0.06), transparent 60%);
            color: var(--parchment);
            font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
            min-height: 100vh;
            padding: 48px 24px 80px;
        }

        .masthead {
            max-width: 480px;
            margin: 0 auto 32px;
            text-align: center;
            border-bottom: 1px solid var(--panel-line);
            padding-bottom: 20px;
        }

        .masthead .eyebrow {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .masthead h1 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin: 0;
            color: #e8ddc7;
        }

        .card {
            max-width: 480px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            position: relative;
            padding: 28px 26px 24px;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--oxblood), transparent 70%);
        }

        .section-label {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--parchment-dim);
            margin: 18px 0 6px;
        }

        .section-label:first-of-type { margin-top: 0; }

        input {
            width: 100%;
            box-sizing: border-box;
            background: var(--ink);
            border: 1px solid var(--panel-line);
            color: var(--parchment);
            padding: 8px 10px;
            border-radius: 2px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--oxblood-bright);
        }

        button {
            margin-top: 22px;
            width: 100%;
            background: var(--oxblood);
            color: #e8ddc7;
            border: 1px solid var(--oxblood-bright);
            padding: 10px;
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: var(--oxblood-bright);
        }

        #result {
            max-width: 480px;
            margin: 20px auto 0;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            padding: 20px 24px;
            font-size: 14.5px;
            line-height: 1.6;
            display: none;
        }

        #result:not(:empty) { display: block; }

        #result .roll-reason {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }
        #roll-log {
            max-width: 480px;
            margin: 20px auto 0;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            padding: 4px 20px;
            max-height: 300px;
            overflow-y: auto;
        }

    .roll-entry {
        font-size: 13.5px;
        color: var(--parchment);
        padding: 8px 0;
        border-bottom: 1px dotted var(--panel-line);
    }

    .roll-entry:last-child {
        border-bottom: none;
    }



    </style>
</head>
<body>
    <div class="masthead">
        <div class="eyebrow">Deimos Archive</div>
        <h1>Roll the Dice</h1>
    </div>

    <form class="card" hx-post="/roll" hx-target="#result">
        <div class="section-label">Character name</div>
        <input type="text" name="character" placeholder="e.g. Alice">

        <div class="section-label">Reason (optional)</div>
        <input type="text" name="reason" placeholder="e.g. Dex + Wits, dominate the scribe">

        <div class="section-label">Dice</div>
        <input type="text" name="notation" placeholder="e.g. 5d10" value="5d10">

        <div class="section-label">Difficulty</div>
        <input type="number" name="difficulty" placeholder="Difficulty" value="6">

        <div class="section-label">Table Passphrase</div>
        <input type="text" name="password" placeholder="are you at the table?">

        <button type="submit">Roll</button>
    </form>

    <div id="result"></div>
    <div id="roll-log" hx-ext="sse" sse-connect="/events" sse-swap="message" hx-swap="beforeend"></div>
</body>
</html>
